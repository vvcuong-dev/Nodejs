    <title>Document</title>

  <body>
    <script>
      const getUsers = async () => {
        const response = await fetch(`http://localhost:3000/api/v1/users`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },

        const data = await response.json();
        console.log(data);
      };

      getUsers();
    </script>
